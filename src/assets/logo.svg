<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Skillo Pure Geometric Logo Mark -->
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Upper Wing (Right Triangle) -->
  <polygon points="76,40 186,40 186,200" fill="#FFFFFF" />

  <!-- Left Lower Wing (Right Triangle) -->
  <polygon points="186,200 186,360 76,360" fill="#FFFFFF" />

  <!-- Right Upper Wing (Right Triangle) -->
  <polygon points="214,40 324,40 214,200" fill="#FFFFFF" />

  <!-- Right Lower Wing (Right Triangle) -->
  <polygon points="214,200 324,360 214,360" fill="#FFFFFF" />

  <!-- Central Laser Core Beam in Vibrant Cyan -->
  <rect x="196" y="40" width="8" height="320" fill="#00E5FF" filter="url(#cyanGlow)" />
</svg>
